run_name: O2O_CUS15_FRRO_DYN_MEM_DDE_KV_R40_U4_E1000
dataset_name: EVRPTW-D_Geo-AC-v1
data:
  generator_config: configs/amazon_hierarchy.yaml
  num_customers: 15
  num_charging_stations: 3
  mother_board_pool_size: 32
  mother_num_customers: 5000
  mother_num_charging_stations: 120
  region_reuse_limit: 200
  max_attempts_per_instance: 30
  territory_pool_path: null
  region_pool_path: null
  region_pool_shuffle: true
  region_pool_replacement_policy: cycle
  train_dataset_path: EVRPTW_Dataset/dataset_v1/dataset/train/Cus15
  train_sample_mode: shuffle_cycle
  async_instance_prefetch: false
  async_instance_workers: 8
  async_instance_queue_batches: 2
  async_multiprocessing_context: spawn
env:
  use_fast_env: true
  use_jit_mask: true
  normalize_reward: true
  reward_distance_scale_mode: dataset_single_customer_repair_median
  charging_mode: fixed_full
  info_level: light
model:
  embedding_dim: 256
  tanh_clipping: 15.0
  n_encode_layers: 2
  use_graph_token: true
  use_dynamic_decision_encoder: true
  dynamic_decision_heads: 4
training:
  online_training: false
  epochs: 1000
  num_envs_per_gpu: 640
  n_traj: 50
  rollout_steps: 40
  ppo_step_chunk_size: 64
  ppo_update_epochs: 4
  num_minibatches: 16
  gamma: 0.99
  clip_coef: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  learning_rate: 0.0001
  weight_decay: 0.0
  max_grad_norm: 1.0
  checkpoint_interval: 50
  debug: true
  debug_log_every: 1
  profile_timing: false
  gradient_accumulation_steps: 1
  mixed_precision: true
pbrs:
  use_customer_pbrs: false
  use_repair_distance_pbrs: false
  use_feasible_ratio_pbrs: false
  use_terminal_heuristic: false
evaluation:
  eval_interval: 10
  eval_path: EVRPTW_Dataset/dataset_v1/dataset/val/Cus15
  eval_n_traj: 50
  eval_decode_mode: sample
  eval_max_steps: 40
  eval_limit: null
  eval_batch_size: 1000
  eval_num_batches: null
  eval_info_level: light
  eval_save_routes: false
offline:
  method: frro
  expert_solution_path: results/offline_experts/dataset_v1/train/Cus15_Gurobi_2h/gurobi_summary.csv
  expert_dataset_path: EVRPTW_Dataset/dataset_v1/dataset/train/Cus15
  expert_limit: null
  strict_replay: true
  sl_coef: 0.1
  route_clip_eps: 0.2
  only_success_route_loss: true
advantage:
  use_group_advantage: false
  group_adv_coef: 0.0
  group_adv_clip: 3.0
  group_adv_std_floor: 5.0
  use_reference_advantage: false
  use_frro: true
  frro_coef: 1.0
  frro_advantage_mode: remaining_gap
  frro_gap_baseline: mean
  frro_gap_floor_ratio: 0.01
  frro_gap_scale_coef: 1.0
  frro_std_floor: 5.0
  frro_rho: 0.1
  frro_clip: 2.0
  frro_success_only: true
  frro_positive_coef: 1.0
  frro_negative_coef: 1.0
  frro_quality_gate_eta: 0.05
  frro_falsification_margin: 0.005
  frro_falsification_eta: 0.05
  frro_use_memory_falsification: true
  frro_use_current_falsification: true
  frro_use_expert_candidate: true
  frro_expert_candidate_weight: 2.0
  frro_use_support_gate: false
